spring.application.name=skill-gap-analyzer

# ---- Server ----
# 8080 is taken on this machine by another background service (AgentService),
# so the app listens on 8081. Change this line if you free up 8080.
server.port=8081

# ---- Resume upload limits ----
# Enforced by Spring before our code ever runs, so a huge upload is rejected at the
# boundary instead of being buffered into memory first. Exceeding this raises
# MaxUploadSizeExceededException, which GlobalExceptionHandler turns into a 413.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Note ----
# This application is stateless: no datasource, no JPA, no database.
# Every request is self-contained and nothing is persisted. Uploaded resumes are
# parsed in memory and discarded; nothing is ever written to disk.
